name: Android CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up build secrets
        shell: bash
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          FONTS: ${{ secrets.FONTS }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICE_JSON" | base64 --decode > /tmp/google-services.json
          for app in app-arducon app-cnubus app-comssa app-my-grade app-nanda; do
            cp /tmp/google-services.json "$app/google-services.json"
          done
          printf '%s' "$LOCAL_PROPERTIES" | base64 --decode > local.properties
          mkdir -p core/component/src/commonMain/res/values
          printf '%s' "$FONTS" | base64 --decode > core/component/src/commonMain/res/values/font_certs.xml

      - name: Test and lint
        run: ./gradlew test lint

      - name: Assemble debug apps
        run: ./gradlew assembleDebug
