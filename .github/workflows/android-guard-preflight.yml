name: Android Dependency Guard preflight
on:
  push:
    branches: [codex/android-guard-preflight-20261122]
permissions:
  contents: read
jobs:
  guard:
    name: Guard ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [app-arducon, app-nanda]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Java 21 for API 36 Robolectric tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up repository-pinned build JDK
        uses: ./.github/actions/setup-java
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the exact compile SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Register installed test and build JDKs
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.installations.paths=%s,%s\n' "$JAVA_HOME_21_X64" "$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - name: Generate public offline fixtures
        run: python3 .github/scripts/prepare-offline-build.py
      - name: Report release dependency graph and Guard differences
        shell: bash
        env:
          APP_MODULE: ${{ matrix.app }}
        run: |
          log="$RUNNER_TEMP/$APP_MODULE-guard.log"
          ./gradlew --no-daemon --max-workers=2 --no-parallel --console=plain \
            --no-configuration-cache --continue -Pandroid.builder.sdkDownload=false \
            ":${APP_MODULE}:dependencies" --configuration releaseRuntimeClasspath \
            ":${APP_MODULE}:dependencyGuard" 2>&1 | tee "$log"
          if grep -Eq -- '--- .* FAILED([[:space:]]|$)' "$log"; then
            echo "At least one release runtime dependency failed resolution." >&2
            exit 1
          fi
