on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/build-play-bundles
        with:
          app-modules: app-comssa app-cnubus app-my-grade app-nanda app-arducon
          google-service-json: ${{ secrets.GOOGLE_SERVICE_JSON }}
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}
          font-certs: ${{ secrets.FONTS }}
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Upload Release AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aabs
          path: |
            app-comssa/build/outputs/bundle/release/app-comssa-release.aab
            app-cnubus/build/outputs/bundle/release/app-cnubus-release.aab
            app-my-grade/build/outputs/bundle/release/app-my-grade-release.aab
            app-nanda/build/outputs/bundle/release/app-nanda-release.aab
            app-arducon/build/outputs/bundle/release/app-arducon-release.aab
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app-comssa
            package_name: com.keelim.comssa
            alias_secret: COMSSA_ALIAS
          - module: app-cnubus
            package_name: com.keelim.cnubus
            alias_secret: CNUBUS_ALIAS
          - module: app-my-grade
            package_name: com.keelim.mygrade
            alias_secret: MYGRADE_ALIAS
          - module: app-nanda
            package_name: com.keelim.nandadiagnosis
            alias_secret: NANDA_ALIAS
          - module: app-arducon
            package_name: com.keelim.arducon
            alias_secret: ARDUCON_ALIAS

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/publish-play-bundle

      - name: Download Release AAB artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-aabs
          path: .

      - name: Publish ${{ matrix.module }} to Play Store
        uses: ./.github/actions/publish-play-bundle
        with:
          app-module: ${{ matrix.module }}
          package-name: ${{ matrix.package_name }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets[matrix.alias_secret] }}
          key-store-password: ${{ secrets.KEY_STORE_PASSWORD }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          service-account-json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
