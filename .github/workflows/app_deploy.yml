on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set environment
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_JSON }}' | base64 -d > ./app-cnubus/google-services.json
          echo '${{ secrets.GOOGLE_SERVICE_JSON }}' | base64 -d > ./app-comssa/google-services.json
          echo '${{ secrets.GOOGLE_SERVICE_JSON }}' | base64 -d > ./app-my-grade/google-services.json
          echo '${{ secrets.GOOGLE_SERVICE_JSON }}' | base64 -d > ./app-nanda/google-services.json
          echo '${{ secrets.GOOGLE_SERVICE_JSON }}' | base64 -d > ./app-arducon/google-services.json
          echo '${{ secrets.LOCAL_PROPERTIES }}' | base64 -d > ./local.properties
          mkdir -p ./core/component/src/commonMain/res/values/
          echo '${{ secrets.FONTS }}' | base64 -d > ./core/component/src/commonMain/res/values/font_certs.xml

      - name: Build Release AAB
        id: buildRelease
        run: |
          ./gradlew -PenableOssLicenses=true app-comssa:bundleRelease app-cnubus:bundleRelease app-my-grade:bundleRelease app-nanda:bundleRelease app-arducon:bundleRelease

      - name: Upload Release AAB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-aabs
          path: |
            app-comssa/build/outputs/bundle/release/app-comssa-release.aab
            app-cnubus/build/outputs/bundle/release/app-cnubus-release.aab
            app-my-grade/build/outputs/bundle/release/app-my-grade-release.aab
            app-nanda/build/outputs/bundle/release/app-nanda-release.aab
            app-arducon/build/outputs/bundle/release/app-arducon-release.aab
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: comssa
            release_directory: app-comssa/build/outputs/bundle/release
            release_file: app-comssa/build/outputs/bundle/release/app-comssa-release.aab
            package_name: com.keelim.comssa
            alias_secret: COMSSA_ALIAS
          - app: cnubus
            release_directory: app-cnubus/build/outputs/bundle/release
            release_file: app-cnubus/build/outputs/bundle/release/app-cnubus-release.aab
            package_name: com.keelim.cnubus
            alias_secret: CNUBUS_ALIAS
          - app: mygrade
            release_directory: app-my-grade/build/outputs/bundle/release
            release_file: app-my-grade/build/outputs/bundle/release/app-my-grade-release.aab
            package_name: com.keelim.mygrade
            alias_secret: MYGRADE_ALIAS
          - app: nanda
            release_directory: app-nanda/build/outputs/bundle/release
            release_file: app-nanda/build/outputs/bundle/release/app-nanda-release.aab
            package_name: com.keelim.nandadiagnosis
            alias_secret: NANDA_ALIAS
          - app: arducon
            release_directory: app-arducon/build/outputs/bundle/release
            release_file: app-arducon/build/outputs/bundle/release/app-arducon-release.aab
            package_name: com.keelim.arducon
            alias_secret: ARDUCON_ALIAS

    steps:
      - name: Download Release AAB artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-aabs
          path: .

      - name: Create service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Sign ${{ matrix.app }} AAB
        uses: keelim/upload-google-play@v0.0.8
        with:
          type: sign
          releaseDirectory: ${{ matrix.release_directory }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets[matrix.alias_secret] }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Deploy to Play Store ${{ matrix.app }}
        uses: keelim/upload-google-play@v0.0.8
        with:
          type: upload
          serviceAccountJson: service_account.json
          packageName: ${{ matrix.package_name }}
          releaseFiles: ${{ matrix.release_file }}
          track: production
          status: completed
          changesNotSentForReview: false
