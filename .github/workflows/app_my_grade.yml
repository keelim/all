on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/build-play-bundles
        with:
          app-modules: app-my-grade
          google-service-json: ${{ secrets.GOOGLE_SERVICE_JSON }}
          local-properties: ${{ secrets.LOCAL_PROPERTIES }}
          font-certs: ${{ secrets.FONTS }}
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: ./.github/actions/publish-play-bundle
        with:
          app-module: app-my-grade
          package-name: com.keelim.mygrade
          signing-key: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.MYGRADE_ALIAS }}
          key-store-password: ${{ secrets.KEY_STORE_PASSWORD }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          service-account-json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          changes-not-sent-for-review: 'true'
