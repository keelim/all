name: Common Android build validation
on:
  push:
    branches: [develop, 'codex/all-build-repair-*']
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  build:
    name: clean-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scope:
          - appfunctions
          - app-arducon
          - app-cnubus
          - app-comssa
          - app-my-grade
          - app-nanda
          - app-mysenior
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Java 21 for API 36 Robolectric tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up repository-pinned build JDK
        uses: ./.github/actions/setup-java
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the exact compile SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Register installed test and build JDKs
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.installations.paths=%s,%s\n' "$JAVA_HOME_21_X64" "$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
      - name: Verify SDK and wrapper declarations
        run: python3 .github/scripts/verify-common-build.py configuration
      - name: Generate public offline fixtures
        run: python3 .github/scripts/prepare-offline-build.py
      - name: Clean compile and test AppFunctions with shared Android baseline
        if: matrix.scope == 'appfunctions'
        run: ./gradlew --no-daemon --max-workers=2 -Pandroid.builder.sdkDownload=false clean :core:common-android:assembleDebug :core:common-android:testDebugUnitTest :feature:app-function:assembleDebug :feature:app-function:testDebugUnitTest --info
      - name: Verify generated function contracts and test discovery
        if: matrix.scope == 'appfunctions'
        run: python3 .github/scripts/verify-common-build.py appfunctions
      - name: Clean compile and test Android app
        if: matrix.scope != 'appfunctions'
        env:
          APP: ${{ matrix.scope }}
        run: |
          tasks=(clean ":$APP:assembleDebug" ":$APP:testDebugUnitTest")
          ./gradlew --no-daemon --continue --stacktrace --max-workers=1 --no-parallel '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:ReservedCodeCacheSize=256m' -Pkotlin.compiler.execution.strategy=in-process -Pandroid.builder.sdkDownload=false "${tasks[@]}"
      - name: Verify debug APK and AppFunctions packaging
        if: always() && matrix.scope != 'appfunctions'
        env:
          APP: ${{ matrix.scope }}
        run: python3 .github/scripts/verify-common-build.py consumers "$APP"
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-build-${{ matrix.scope }}
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/**
            feature/app-function/build/generated/ksp/debug/**
            app-*/build/outputs/logs/manifest-merger-debug-report.txt
          if-no-files-found: warn
