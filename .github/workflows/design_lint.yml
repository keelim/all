name: Lint DESIGN.md

on:
  workflow_dispatch:
  pull_request:
    paths:
      - DESIGN.md
      - .github/workflows/design_lint.yml
  push:
    branches:
      - develop
      - main
    paths:
      - DESIGN.md
      - .github/workflows/design_lint.yml

concurrency:
  group: design-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: design.md lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep the linter version in sync with the `design-lint` task in mise.toml.
      - name: Lint DESIGN.md
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md
