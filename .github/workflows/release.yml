name: Create Release PR

on:
  workflow_dispatch:

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Get current date
        id: date
        run: echo "TODAY=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Update versionCode in libs.versions.toml
        run: |
          echo "Updating versionCode to ${{ env.TODAY }}"
          sed -i "s/^versionCode = .*/versionCode = \"${{ env.TODAY }}\"/" gradle/libs.versions.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update versionCode to ${{ env.TODAY }}"
          branch: "release/${{ env.TODAY }}"
          base: "main"
          title: "release/${{ env.TODAY }}"
          body: |
            This PR updates the versionCode to `${{ env.TODAY }}`.

            Auto-generated by the 'Create Release PR' workflow.

