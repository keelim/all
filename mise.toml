min_version = "2026.10.8"

[tools]
# Keep the exact existing Temurin runtime used for scoped module verification.
java = "temurin-17.0.20+8"

[tool_config]
locked = true

[settings.task]
# Install explicitly; inspection must not install inherited workspace tools.
run_auto_install = false

[tasks.doctor]
description = "Check the exact JDK and checked-in Gradle Wrapper"
run = [
  '''
set -eu
java_properties="$(java -XshowSettings:properties -version 2>&1)"
runtime="$(printf '%s\n' "$java_properties" | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
vendor="$(printf '%s\n' "$java_properties" | sed -n 's/^[[:space:]]*java.vendor = //p')"
printf 'Java runtime: %s (%s)\n' "$runtime" "$vendor"
expected_runtime="$(sed -n 's/^java = "temurin-\(.*\)"/\1/p' mise.toml)"
test -n "$expected_runtime"
test "$runtime" = "$expected_runtime"
test "$vendor" = 'Eclipse Adoptium'
test "$(javac -version 2>&1)" = "javac ${expected_runtime%+*}"
for property in distributionUrl distributionSha256Sum; do
  root_value="$(sed -n "s/^${property}=//p" gradle/wrapper/gradle-wrapper.properties)"
  build_logic_value="$(sed -n "s/^${property}=//p" build-logic/gradle/wrapper/gradle-wrapper.properties)"
  test -n "$root_value"
  test "$root_value" = "$build_logic_value"
done
''',
  "./gradlew --version",
]

[tasks.lint]
description = "Run Android lint for the representative core:common-android module"
depends = ["doctor"]
run = "./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :core:common-android:lintDebug"

[tasks.test]
description = "Run existing core:common-android JVM unit tests"
depends = ["doctor"]
run = "./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :core:common-android:testDebugUnitTest"

[tasks.build]
description = "Assemble the representative core:common-android debug library"
depends = ["doctor"]
run = "./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :core:common-android:assembleDebug"

[tasks.ci]
description = "Run the same representative verification locally and in CI"
run = [
  { task = "doctor" },
  { task = "test" },
  { task = "lint" },
  { task = "build" },
]

[tasks.default]
description = "Inspect the pinned JDK and Gradle Wrapper"
run = [{ task = "doctor" }]
